[build]
  command   = "npm run build"
  publish   = "dist"

# SPA fallback — every unknown path is served by index.html so vue-router
# can resolve it client-side. Without this, direct hits on /atm, /dashboard,
# etc. return 404.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
